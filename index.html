<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emerald Lost Generation</title>
<meta name="description" content="Friend portal for the Emerald Lost Generation ROM hack.">
<meta name="robots" content="noindex">
<script>
  // Apply the saved theme before first paint (no flash).
  try { var t = localStorage.getItem("elg-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="app-header" id="header" hidden>
  <a class="brand" href="#/home">Emerald Lost Generation</a>
  <nav class="nav" id="nav">
    <a href="#/home" data-route="home">Home</a>
    <a href="#/roles" data-route="roles">Roles</a>
    <a href="#/me" data-route="me">My Character</a>
    <a href="#/ideas" data-route="ideas">Ideas</a>
    <a href="#/profile" data-route="profile">Crew</a>
    <a href="#/admin" data-route="admin" id="nav-admin" hidden>Admin</a>
  </nav>
  <div class="row">
    <button class="theme-toggle btn btn-ghost btn-small" id="theme-toggle" type="button" aria-label="Switch theme">Light mode</button>
    <button class="btn btn-ghost btn-small" id="logout" type="button">Log out</button>
  </div>
</header>
<button class="theme-toggle btn btn-ghost btn-small" id="theme-toggle-auth" type="button" aria-label="Switch theme" hidden>Light mode</button>
<main class="container" id="app"><p class="loading">Loading…</p></main>
<div id="toasts" aria-live="polite"></div>
<dialog class="sheet" id="sheet"></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
